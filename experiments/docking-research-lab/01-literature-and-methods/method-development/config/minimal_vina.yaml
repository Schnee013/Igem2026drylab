preparation:
  receptor:
    chain: "A"
    records: "standard ATOM residues only"
    preserve_ecl2: true
    adfr_add_hydrogens: true
    adfr_cleanup: "nphs_lps_waters_nonstdres"
  ligand:
    protonation: "neutral carboxylic acid"
    orca_method: "B3LYP"
    orca_basis: "def2-TZVP"
    orca_job: "Opt TightOpt"
    orca_charge: 0
    orca_multiplicity: 1
    adfr_add_hydrogens: true
    rotatable_bonds: "aliphatic-chain and ascarylose-exocyclic heavy-atom single bonds"
    dof_reference_range: [7, 11]
    dof_validation: "BRANCH count, TORSDOF and active-torsion REMARK must agree; stop for bond review outside reference range"

docking:
  scoring: "vina"
  receptor_rigid: true
  box:
    center_source: "mass-weighted all-atom COM of the extracted WT receptor PDB before ADFR"
    mutant_rule: "reuse the stored numeric center from the corresponding WT"
    size_angstrom: [40.0, 40.0, 40.0]
    spacing_angstrom: 0.1
    offset_angstrom: [0.0, 0.0, 0.0]
  exhaustiveness: 200
  seed: 44
  cpu: 4
  num_modes: 5
  energy_range_kcal_mol: 5.0
  min_rmsd_angstrom: 1.0
  max_evals: 0

contact_analysis:
  poses: 5
  interaction_types: [HBAcceptor, HBDonor, Hydrophobic, Anionic, Cationic, VdWContact]
  count_rule: "a residue is counted at most once per pose"
  high_frequency_min_poses: 3
  ligand_specific_other_max_poses: 1
  groups: [shared, ascr3_only, ascr18_only, ambiguous]
  hu2024_distance_check_angstrom: 3.5
  top1_2d_diagram: true
  first_round_protected_sites: ["shared high-frequency contacts", "D2.50", "S2.41"]
  manual_review_sites: ["R-motif"]
  max_candidates_per_receptor: 2

pose_gate:
  required_location: "extracellular orthosteric pocket"
  expected_regions: [TM2, TM3, TM5, TM6, TM7]
  record_ecl2_contact: true
  suspicious_regions: ["intracellular side", "membrane-exposed groove", "TM1/TM4-dominated pocket"]
  gprc_ascr18_reference_score_kcal_mol: -8.29
  score_reference_is_gate: false

ranking:
  ddg18: "dg_mut_ascr18 - dg_wt_ascr18"
  ddg3: "dg_mut_ascr3 - dg_wt_ascr3"
  ddg_selectivity: "ddg18 - ddg3"
  negative_direction: "relatively favors ascr18"
  positive_direction: "relatively favors ascr3"
  require_same_protocol: true
  vina_score_use: "same-protocol relative ranking only"

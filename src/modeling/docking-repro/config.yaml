# Hu2024 精确复现 Pipeline 配置
# 方法参考: Hu et al. 2024 Nat Microbiol (doi: 10.1038/s41564-024-01731-9)
# 执行架构: Mac M1（代码/分析）→ Windows 7500F（ADFR/Orca/Vina 计算）

pipeline_version: "hu2024-repro-v1"
method_reference: "Hu et al. 2024 Nat Microbiol"

# ---------------------------------------------------------------------------
# 路径配置（相对于 project_root）
# ---------------------------------------------------------------------------
paths:
  project_root: "/Users/roy/Documents/drylab"
  # 输入：共享 v2 的原始 PDB 和 SDF（不复制，通过 symlink 引用）
  receptor_dir: "experiments/docking/receptors"
  ligand_dir: "experiments/docking/ligands"
  # 输出：独立目录
  prepared_dir: "experiments/docking-repro/prepared"
  results_dir: "experiments/docking-repro/results"
  analysis_dir: "experiments/docking-repro/analysis"
  log_dir: "experiments/docking-repro/logs"
  orca_dir: "experiments/docking-repro/ligands/orca"
  mutagenesis_dir: "experiments/docking-repro/mutagenesis"

# ---------------------------------------------------------------------------
# Windows 计算节点（通过 SSH 远程调用）
# ---------------------------------------------------------------------------
remote:
  host: "100.87.153.84"
  user: "Administrator"
  # 所有工具统一放在 D:\drylab-tools\ 下，不占用 C 盘
  work_dir: "D:/drylab-tools/workspace"
  adfr_bin: "D:/ADFRsuite/bin"                 # ADFR Suite 安装在 D:\ADFRsuite
  orca_bin: "D:/orca/orca.exe"                 # Orca 6.1.1 Win64 msmpi
  vina_bin: "D:/drylab-tools/vina.exe"         # AutoDock-Vina v1.2.7 standalone
  conda_python: "D:/drylab-tools/envs/docking-repro/python.exe"
  conda_prefix: "D:/drylab-tools/envs/docking-repro"  # 用 conda run --prefix 调用
  conda_env: "docking-repro"

# ---------------------------------------------------------------------------
# 受体配置（与 v2 相同，只对接 GprC 复现 Hu2024）
# ---------------------------------------------------------------------------
receptors:
  GprC:
    pdb_file: "GprC_A0A437AGY2.pdb"
    uniprot: "A0A437AGY2"
    species: "Arthrobotrys flagrans"
    n_residues: 538
    # Hu2024: pLDDT > 0.85 for TM region
  # Gpr2/Gpr3 也包含（复现 Kuo2024 排名验证）
  Gpr2:
    pdb_file: "Gpr2_G1X9E2.pdb"
    uniprot: "G1X9E2"
    species: "Arthrobotrys oligospora"
    n_residues: 406
  Gpr3:
    pdb_file: "Gpr3_G1XJN1.pdb"
    uniprot: "G1XJN1"
    species: "Arthrobotrys oligospora"
    n_residues: 401

# ---------------------------------------------------------------------------
# 配体配置
# ---------------------------------------------------------------------------
ligands:
  ascr1:
    sdf_file: "ascr1_CID11471380.sdf"
    smiles: "CC1C(CC(C(O1)OC(C)CCCCC(=O)O)O)O"
    pubchem_cid: 11471380
    formula: "C13H24O6"
    # ascr#1 (daumone-1), C7 链长饱和 ascaroside
    # SDF 来源: experiments/docking/ligands/ascr1_CID11471380.sdf（PubChem 3D）
    # 需走 Orca B3LYP/def2-TZVP 优化 + ADFR prepare_ligand
  ascr18:
    sdf_file: "ascr18_CID71514784.sdf"
    smiles: "CC1C(CC(C(O1)OC(C)CCCCCCCCC(=O)O)O)O"
    pubchem_cid: 71514784
    formula: "C17H32O6"
    # Hu2024: 使用 Avogadro 构建 + Orca 优化
    # 本方案: SMILES → RDKit 3D 嵌入 → Orca 优化（等效）
  ascr3:
    sdf_file: "ascr3_CID16066476.sdf"
    smiles: "CC1C(CC(C(O1)OC(C)CCCCC=CC(=O)O)O)O"
    pubchem_cid: 16066476
    formula: "C15H26O6"
  ascr7:
    sdf_file: "ascr7_CID86289656.sdf"
    smiles: "CC1C(CC(C(O1)OC(C)CCC=CC(=O)O)O)O"
    pubchem_cid: 86289656
    formula: "C13H22O6"

# ---------------------------------------------------------------------------
# ADFR Suite 受体/配体准备参数
# ---------------------------------------------------------------------------
adfr:
  receptor:
    # prepare_receptor 标准参数（匹配 Hu2024）
    add_hydrogens: true                  # -A hydrogens
    cleanup: "nphs_lps_waters_nonstdres" # -U 选项：去除非极性氢、孤对电子、水、非标准残基
  ligand:
    max_dofs: 11                         # 上限 11 DOFs（Hu2024: "7-11 DOFs"）
    # ascarylose 环外非环单键设为可旋转（Hu2024 方法）
    rotatable_bonds: "non_cyclic"        # -B non_cyclic
    add_hydrogens: true                  # -A hydrogens

# ---------------------------------------------------------------------------
# Orca 量子化学优化参数
# ---------------------------------------------------------------------------
orca:
  method: "B3LYP"                        # Hu2024: B3LYP
  basis: "def2-TZVP"                     # Hu2024: def2-TZVP
  keywords: "OPT TightOPT"              # 几何优化，严格收敛
  charge: 0
  multiplicity: 1
  nprocs: 6                             # 6=Ryzen 7500F 物理核心数，需 MS-MPI（已安装）
  maxiter: 500
  # 如果 DFT 不收敛的备选方案：
  # method_fallback: "B3LYP"
  # basis_fallback: "def2-SVP"

# ---------------------------------------------------------------------------
# AutoDock Vina 对接参数
# ---------------------------------------------------------------------------
vina:
  seed: 42
  num_modes: 20
  energy_range: 3.0

  # 单阶段（Hu2024 原文精确参数）— 主协议
  singlestage:
    spacing: 0.1
    box_size: 40.0
    exhaustiveness: 200
    # 格点数: (40/0.1+1)^3 = 401^3 = 64.5M
    # Vina 1.2.7 实测可运行，仅输出 WARNING（非崩溃）

  # 两阶段（保留向后兼容，已弃用）
  stage1:
    spacing: 0.25
    box_size: 40.0
    exhaustiveness: 32

  stage2:
    spacing: 0.1
    box_size: 20.0
    exhaustiveness: 200

# ---------------------------------------------------------------------------
# Grid Box（与 v2 一致：受体质心为中心）
# ---------------------------------------------------------------------------
grid_box:
  stage1_size: 40.0
  stage2_size: 20.0
  strategy: "center_of_mass"            # Hu2024: "centre of mass of the receptor"

# ---------------------------------------------------------------------------
# 分析参数
# ---------------------------------------------------------------------------
analysis:
  top_n_poses: 5                         # Hu2024: 分析前 5 个 pose
  plip_enabled: true
  # 文献参考关键残基（Ballesteros-Weinstein 编号）
  key_residues:
    GprC:
      N2_57: 83    # 胞外侧，突变为 Ala 后丧失功能
      R6_45: 281   # R-motif，突变为 Ala 后结合亲和力剧降
      S2_41: 77    # S-motif

# ---------------------------------------------------------------------------
# 验证标准（比 v2 更严格）
# ---------------------------------------------------------------------------
validation:
  tolerance_kcal: 0.5                    # Hu2024 参考值偏差上限（v2 用 1.0）
  reference:
    GprC_ascr18: -8.29                   # Hu2024 Extended Data Table 2
    GprC_ascr3: -8.31                    # Hu2024 Extended Data Table 2
    GprC_ascr1: null                     # 待从 Hu2024 Extended Data Table 2 确认
  kuo2024_absolute:                      # Kuo2024 SwissDock 报告绝对 ΔG（kcal/mol）
    Gpr2_ascr3: -6.99
    Gpr2_ascr7: -7.07
    Gpr3_ascr3: -7.05
    Gpr3_ascr7: -6.41
  kuo2024_rankings:
    Gpr2: ["ascr7", "ascr3"]             # ascr7 > ascr3（结合更强）
    Gpr3: ["ascr3", "ascr7"]             # ascr3 > ascr7

# ---------------------------------------------------------------------------
# In Silico 突变扫描（mutagenesis step）
# ---------------------------------------------------------------------------
mutagenesis:
  # FoldX 可执行文件路径（mutant_source=foldx 时使用）
  foldx_bin: "D:/foldxWindows/foldx_20261231.exe"

  # 突变体结构来源：
  #   "foldx" — FoldX BuildModel（副链替换，快速，精度有限）
  #   "af2"   — AF2 web server 预测结构（需提前手动提交，精度更高，Hu2024 方法）
  #             AF2 PDBQT 存放于: experiments/docking-repro/mutagenesis/af2_prepared/{rec_name}/{label}_tm.pdbqt
  mutant_source: "foldx"                 # 先用 foldx 确认 pipeline 可跑通，验证后改 af2

  # 对接协议：
  #   "singlestage" — 单阶段 40Å/0.1/200（Hu2024 原文，主协议）
  #   "twostage"    — 两阶段（已弃用，保留向后兼容）
  docking_mode: "singlestage"

  # WT 基线来源：
  #   "v2"   — 使用 experiments/docking/（已完成，Kuo2024 排名验证 PASS）
  #   "repro" — 使用 experiments/docking-repro/（Orca DFT 精确复现）
  wt_baseline: "v2"

  # 扫描类型：
  #   "alanine"    — 丙氨酸扫描（每个目标残基 → Ala，快速，验证口袋关键性）
  #   "saturation" — 饱和扫描（每个位点 × 19 种氨基酸，耗时长，找最优替换）
  scan_type: "alanine"

  # 扫描受体
  target_receptors: ["GprC", "Gpr2", "Gpr3"]

  # 扫描残基（绝对残基编号）
  # GprC: Hu2024 实验验证 3 个 + v2 PLIP 高频接触残基
  # Gpr2/Gpr3: v2 PLIP 高频接触残基（ascr18/ascr3/ascr7 union）
  scan_residues:
    GprC:
      # 前 3 个为 Hu2024 实验验证的关键残基（结论可信）
      - 77    # S2.41 — Hu2024 S-motif（实验验证）
      - 83    # N2.57 — Hu2024，突变为 Ala 后功能丧失（阳性对照）
      - 281   # R6.45 — Hu2024 R-motif，突变后亲和力剧降（阳性对照）
      # 以下均来自 v2 PLIP 接触分析，无实验验证
      - 42    # v2 PLIP（ascr3/ascr7 高频）
      - 105   # v2 PLIP（ascr7）
      - 185   # v2 PLIP（最高频，ascr18/3/7 共享）
      - 189   # v2 PLIP（ascr18/3/7 共享）
      - 377   # v2 PLIP（ascr3）
      - 378   # v2 PLIP（ascr18/3/7 共享）
      - 381   # v2 PLIP（ascr18）
      - 425   # v2 PLIP（ascr18）
    # 注意：Gpr2/Gpr3 全部残基来自 v2 PLIP 计算分析，无文献实验验证。
    # Kuo2024 仅报告 Gpr2 Y168 一个结合残基（SwissDock），无 Ala scan 数据。
    Gpr2:
      - 59    # v2 PLIP 最高频（ascr18/3/7 共享）；无实验验证
      - 63    # v2 PLIP（ascr18/ascr7）
      - 120   # v2 PLIP（ascr18）
      - 200   # v2 PLIP（ascr7）；alanine scan ΔΔG_sel=+1.12（效应量最大，方向为增强 ascr3 偏好）
      - 326   # v2 PLIP（ascr3）
      - 327   # v2 PLIP（ascr3）
      - 330   # v2 PLIP（ascr3）
      - 378   # v2 PLIP（ascr18/3/7 共享）；alanine scan ΔΔG_sel=+0.92
      - 381   # v2 PLIP（ascr18/ascr7）
    Gpr3:
      - 192   # v2 PLIP（ascr7）；无实验验证
      - 193   # v2 PLIP（ascr18/3/7 共享）
      - 196   # v2 PLIP（ascr18/3）
      - 197   # v2 PLIP（ascr18/3/7 共享）
      - 285   # v2 PLIP 最高频（ascr18/3/7 共享）
      - 286   # v2 PLIP（ascr18）
      - 288   # v2 PLIP（ascr3）
      - 289   # v2 PLIP（ascr3/ascr7）

# ---------------------------------------------------------------------------
# 补充实验（Supplementary Experiments，解决 Alanine Scan 局限性）
# ---------------------------------------------------------------------------

# S1: WT 两阶段重对接（run_wt_twostage.py）
# 无额外配置，直接使用上方 vina.stage1/stage2 参数
# 输出: experiments/docking-repro/results/wt_twostage/

# S2: 多 seed 方差评估（run_multiseed.py）
multiseed:
  seeds: [42, 123, 456, 789, 1024]
  # WT 受体（全部三个）+ top 突变体（Gpr2 Y200A/Y378A/Y330A/R59A）
  wt_receptors: ["GprC", "Gpr2", "Gpr3"]
  top_mutants:
    - receptor: "Gpr2"
      mutation: "Y200A"
    - receptor: "Gpr2"
      mutation: "Y378A"
    - receptor: "Gpr2"
      mutation: "Y330A"
    - receptor: "Gpr2"
      mutation: "R59A"
  # 输出: experiments/docking-repro/results/multiseed/

# S3: Gpr2 Y200/Y378 饱和扫描（run_saturation_gpr2.py）
# 配置通过脚本内部动态覆盖 mutagenesis 节，不在此单独定义
# 关键参数：
#   scan_type: saturation
#   target_receptors: [Gpr2]
#   scan_residues: {Gpr2: [200, 378]}
#   exclude_aas: [A, P, C]   # A 已测，P 扰骨架，C 形成二硫
# WT 基线: 优先 S1 两阶段结果，否则退回 v2
# 输出: experiments/docking-repro/mutagenesis_saturation_gpr2/

# S4: GprC 扩大 Docking Box（25Å）验证外周残基（run_wt_twostage.py --gprc-expand）
gprc_expanded_box:
  stage2_box_size: 25.0   # 25Å → 251³ = 15.8M 格点（< 27M 限制）
  # 目标：捕获 S77A/N83A（Hu2024 已验证功能丧失残基）的灵敏度
  # 用 dock_pair_twostage(..., stage2_box_size=25.0) 调用
  target_mutants: ["S77A", "N83A", "R42A", "T105A"]   # 原 20Å box 外/边缘残基
